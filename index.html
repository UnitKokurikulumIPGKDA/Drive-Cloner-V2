<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Cloner Pro - Visual System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e293b, #020617);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="glass p-8 sm:p-10 rounded-[2rem] w-full max-w-lg shadow-2xl my-8">
        
        <!-- Tajuk Utama -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">Drive Cloner <span class="text-blue-500">Pro</span></h1>
            <p class="text-slate-400 mt-2 text-sm">Klon folder Google Drive secara rekursif terus ke pangkalan data Sheet anda.</p>
        </div>

        <!-- Borang Input -->
        <div class="space-y-5">
            
            <!-- Input URL Web App (Google Apps Script) -->
            <div>
                <label for="webAppUrl" class="block text-xs font-semibold text-blue-400 uppercase tracking-wider mb-2 ml-1">
                    URL Web App Apps Script
                </label>
                <input type="url" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec" 
                       class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
                <p class="text-[10px] text-slate-500 mt-1 ml-1">*Tampal URL Web App daripada pautan Deployment Apps Script anda.</p>
            </div>

            <!-- Input Folder Sumber -->
            <div>
                <label for="source" class="block text-xs font-semibold text-blue-400 uppercase tracking-wider mb-2 ml-1">
                    Folder Sumber (Source)
                </label>
                <input type="text" id="source" placeholder="Tampal URL atau ID Folder asal..." 
                       class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
            </div>
            
            <!-- Input Folder Sasaran -->
            <div>
                <label for="target" class="block text-xs font-semibold text-blue-400 uppercase tracking-wider mb-2 ml-1">
                    Folder Sasaran (Target)
                </label>
                <input type="text" id="target" placeholder="Tampal URL atau ID Folder sasaran..." 
                       class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
            </div>

            <!-- Butang Pelaksanaan -->
            <button onclick="executeCloningProcess()" id="btnAction"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/30 transition-all flex items-center justify-center group active:scale-[0.99]">
                <span id="btnText">Mula Salin Sekarang</span>
            </button>
        </div>
        
        <!-- Kotak Status Maklum Balas -->
        <div id="statusBox" class="mt-6 p-4 rounded-xl bg-slate-900/80 border border-slate-800 hidden transition-all">
            <div class="flex items-start gap-3">
                <div id="statusIcon" class="text-lg">⏳</div>
                <div class="flex-1">
                    <p id="statusTitle" class="text-xs font-semibold text-white mb-1">Memproses...</p>
                    <p id="statusMsg" class="text-xs text-slate-400 leading-relaxed"></p>
                </div>
            </div>
        </div>

    </div>

    <!-- Logik Skrip Frontend (ES6+) -->
    <script>
        /**
         * Memuatkan tetapan yang disimpan daripada localStorage semasa halaman mula dibuka.
         */
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('drive_cloner_webapp_url');
            if (savedUrl) {
                document.getElementById('webAppUrl').value = savedUrl;
            }
        });

        /**
         * Mengekstrakan ID Drive daripada URL penuh atau mengembalikan rentang asal jika sudah dalam bentuk ID.
         * @param {string} input - URL penuh Drive atau ID Folder.
         * @returns {string} ID Folder yang sah.
         */
        function extractFolderId(input) {
            if (!input) return '';
            const match = input.match(/[-\w]{25,}/);
            return match ? match[0] : input.trim();
        }

        /**
         * Mengendalikan keseluruhan aliran kerja penghantaran maklumat klon ke Apps Script.
         */
        async function executeCloningProcess() {
            const webAppUrl = document.getElementById('webAppUrl').value.trim();
            const sourceRaw = document.getElementById('source').value.trim();
            const targetRaw = document.getElementById('target').value.trim();
            
            const btn = document.getElementById('btnAction');
            const btnText = document.getElementById('btnText');
            const statusBox = document.getElementById('statusBox');
            const statusTitle = document.getElementById('statusTitle');
            const statusMsg = document.getElementById('statusMsg');
            const statusIcon = document.getElementById('statusIcon');

            // 1. Pengesahan Input (Validation)
            if (!webAppUrl) {
                alert("⚠️ Sila masukkan URL Web App Apps Script anda!");
                return;
            }
            if (!sourceRaw || !targetRaw) {
                alert("⚠️ Sila isi kedua-dua maklumat folder sumber dan sasaran!");
                return;
            }

            // Simpan URL Web App ke localStorage untuk kegunaan akan datang
            localStorage.setItem('drive_cloner_webapp_url', webAppUrl);

            const sourceId = extractFolderId(sourceRaw);
            const targetId = extractFolderId(targetRaw);

            // 2. Kemaskini Keadaan UI ke "Loading"
            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');
            btnText.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white mr-2 inline" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg> Sedang Memproses...
            `;
            
            statusBox.classList.remove('hidden');
            statusIcon.innerText = "⏳";
            statusTitle.innerText = "Menghantar Arahan";
            statusTitle.className = "text-xs font-semibold text-blue-400";
            statusMsg.innerText = "Menghantar permintaan ke pelayan Apps Script. Sila tunggu sebentar...";

            // 3. Panggilan API ke Backend
            try {
                const targetEndpoint = `${webAppUrl}?source=${encodeURIComponent(sourceId)}&target=${encodeURIComponent(targetId)}`;
                
                const response = await fetch(targetEndpoint, {
                    method: 'GET',
                    redirect: 'follow'
                });

                const data = await response.json();

                // 4. Pengendalian Maklum Balas Pelayan
                if (data.status === 'success') {
                    statusIcon.innerText = "✅";
                    statusTitle.innerText = "Proses Berjaya Dipulakan!";
                    statusTitle.className = "text-xs font-semibold text-green-400";
                    statusMsg.innerHTML = `<b>Mesej:</b> ${data.message}<br><b>Jumlah Fail:</b> ${data.details.filesCopied}<br><b>Jumlah Subfolder:</b> ${data.details.foldersCreated}`;
                    
                    btnText.innerText = "Selesai";
                    btn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
                    btn.classList.add('bg-green-600');
                } else {
                    throw new Error(data.message || "Ralat tidak diketahui berlaku pada pelayan.");
                }

            } catch (error) {
                // Pengendalian Ralat Rangkaian / Pelayan
                statusIcon.innerText = "❌";
                statusTitle.innerText = "Ralat Pelaksanaan";
                statusTitle.className = "text-xs font-semibold text-red-400";
                statusMsg.innerText = error.message || "Gagal berhubung dengan pelayan. Pastikan Web App disetkan kepada 'Anyone'.";

                btnText.innerText = "Cuba Lagi";
            } finally {
                // Pulihkan semula butang
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
